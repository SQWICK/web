<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Lab1 web</title>
</head>
<body>
    <div class="label">
        <h1>Дубовец Дмитрий Александрович</h1>
        <h2>Группа:P3215 Вариант:12734</h2>
        <img class="kot" width="140" height="120" src="https://i.pinimg.com/originals/d6/f2/38/d6f238dcf1e585ef7bc421a18cc7538f.jpg">
        <img class="kot2" width="140" height="120" src="https://avatars.mds.yandex.net/i?id=0c15df42fa02a43c76f9859e83bf2fac_l-5251549-images-thumbs&n=13">
    </div>

    <div class="main">
        <div class="zalupa">
            <canvas id="canvas" width="600" height="600"></canvas>
        </div>

        <div class="side-panel">
            <div class="form">
                <h4>Значение X:</h4>
                <div class="input-group">
                    <input placeholder="Введите X(-3..5)" id="xInput" name="xValue">
                </div>
            </div>

            <div class="form">
                <h4>Значение Y:</h4>
                <div class="input-group">
                    <select name="Y" id="select">
                        <option value="">Выберите вариант</option>
                        <option value="-2">-2</option>
                        <option value="-1.5">-1.5</option>
                        <option value="-1">-1</option>
                        <option value="-0.5">-0.5</option>
                        <option value="0">0</option>
                        <option value="0.5">0.5</option>
                        <option value="1">1</option>
                        <option value="1.5">1.5</option>
                        <option value="2">2</option>
                    </select>
                </div>
            </div>

            <div class="form">
                <h4>Значение R:</h4>
                <div class="input-group" id="rGroup">
                    <button type="button">1</button>
                    <button type="button">1.5</button>
                    <button type="button">2</button>
                    <button type="button">2.5</button>
                    <button type="button">3</button>
                </div>
            </div>

            <button id="checkBtn" type="button">Проверить</button>
            <button id="clearBtn" type="button">Очистить LS</button>
        </div>
    </div>
    
    <div class="table">
        <table id="resultTable">
            <thead>
                <tr>
                    <th>X</th>
                    <th>Y</th>
                    <th>R</th>
                    <th>Результат</th>
                    <th>Время</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script src="script_canvas.js"></script>
    <script src="main_script.js"></script>
</body>
</html>
